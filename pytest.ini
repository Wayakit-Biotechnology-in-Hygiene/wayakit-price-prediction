# pytest configuration for Price Intelligence.
# How to run: scripts/verify.sh quick|full (see .claude/skills/verify).
# Directly (conda environment wayakit-price-prediction): python -m pytest -m "unit or property" -q
# Hypothesis: profile "pi" (200 examples, deterministic) by default; to look for new bugs,
# HYPOTHESIS_PROFILE=exploration python -m pytest -m property -q (2000 examples, ~2 min).
# Every test carries one of the markers below; if it is missing, tests/conftest.py stops pytest.
[pytest]
testpaths = tests
# importlib: two test files with the same name in different folders do not collide.
# pythonpath = . allows importing the helpers with "from tests.conftest import ...".
addopts = -ra --strict-markers --import-mode=importlib
pythonpath = .
# An xfail that suddenly passes is a failure: the bug was fixed and the mark must be removed.
xfail_strict = true
markers =
    unit: fast unit test, no network and no files outside tmp
    property: property-based test (Hypothesis)
    e2e: runs the full pipeline with frozen F1 data
    differential: compares the base version against the new version with the same inputs
