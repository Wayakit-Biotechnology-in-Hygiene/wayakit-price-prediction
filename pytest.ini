# Configuración de pytest para Price Intelligence.
# Cómo correr: scripts/verify.sh rapido|completo (ver .claude/skills/verify).
# Directo (entorno conda wayakit-price-prediction): python -m pytest -m "unit or property" -q
# Hypothesis: perfil "pi" (200 ejemplos, determinista) por omisión; para buscar bugs nuevos,
# HYPOTHESIS_PROFILE=exploracion python -m pytest -m property -q (2000 ejemplos, ~2 min).
# Toda prueba lleva uno de los marcadores de abajo; si falta, tests/conftest.py detiene pytest.
[pytest]
testpaths = tests
# importlib: dos archivos de prueba con el mismo nombre en carpetas distintas no chocan.
# pythonpath = . deja importar los ayudantes con "from tests.conftest import ...".
addopts = -ra --strict-markers --import-mode=importlib
pythonpath = .
# Un xfail que de pronto pasa es una falla: el bug se arregló y la marca debe quitarse.
xfail_strict = true
markers =
    unit: prueba unitaria rápida, sin red ni archivos fuera de tmp
    property: prueba basada en propiedades (Hypothesis)
    e2e: corre el pipeline completo con datos congelados de F1
    differential: compara la versión base contra la versión nueva con las mismas entradas
