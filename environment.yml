# PI environment taken from the instance's `pip freeze` on 2026-11-17 (F1). Local: conda env `wayakit-price-prediction`.
# On the instance the environment is still called `wayakit_env` (run_pipeline.sh:6); it is renamed in the F3 bootstrap.
# For Bedrock with outputConfig (F2), boto3/botocore may need to be upgraded (tested locally with 1.43.115).
name: wayakit-price-prediction
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - pandas==2.3.3
      - numpy==2.2.6
      - scikit-learn==1.7.2
      - scipy==1.15.3
      - joblib==1.5.3
      - selenium==4.41.0
      - webdriver-manager==4.0.2
      - beautifulsoup4==4.14.3
      - boto3==1.42.83
      - botocore==1.42.83
      - requests==2.33.1
      - python-dotenv==1.2.2
